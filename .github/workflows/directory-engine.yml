# The directory engine, daily.
#
# Reads the next ten cities on the cycle with Claude (scripts/directory-engine.mjs),
# verifies every website, merges and ranks, and commits whatever changed. A push
# to main deploys (Vercel), so the archive at /improv-near-you keeps itself.
# Sixty cities at ten a day means every city is re-read about weekly.
#
# Needs one secret: ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions).
# Without it the job fails at the first step and nothing is committed. Run it by
# hand from the Actions tab to seed every city at once (cities: all) or to read
# a few by slug.
name: directory-engine

on:
  schedule:
    - cron: "17 9 * * *" # 09:17 UTC daily, off the hour so it never queues behind everyone else's midnight job
  workflow_dispatch:
    inputs:
      cities:
        description: "all, or comma-separated slugs (e.g. chicago,austin); empty for the next ten on the cycle"
        required: false
        default: ""
      model:
        description: "Claude model id for the run"
        required: false
        default: "claude-sonnet-5"

permissions:
  contents: write

concurrency:
  group: directory-engine
  cancel-in-progress: false

jobs:
  read-the-web:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check the key is set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY is not set in this repository's Actions secrets" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Read the cities
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIRECTORY_MODEL: ${{ github.event.inputs.model || 'claude-sonnet-5' }}
        run: |
          CITIES="${{ github.event.inputs.cities }}"
          if [ "$CITIES" = "all" ]; then
            node scripts/directory-engine.mjs --all
          elif [ -n "$CITIES" ]; then
            node scripts/directory-engine.mjs --cities "$CITIES"
          else
            node scripts/directory-engine.mjs --next 10
          fi

      - name: Commit what changed
        run: |
          git config user.name "directory-engine"
          git config user.email "directory-engine@users.noreply.github.com"
          git add data/directory
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          CHANGED=$(git diff --cached --name-only -- 'data/directory/*.json' | grep -v -E 'cities.json|engine-state.json' | sed 's#data/directory/##; s#.json##' | tr '\n' ' ')
          git commit -m "Directory engine: ${CHANGED:-state} ($(date -u +%Y-%m-%d))" -m "Read by Claude with web search, websites verified, merged and ranked by scripts/directory-engine.mjs."
          git push
