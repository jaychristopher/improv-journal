<svg viewBox="0 0 400 216" xmlns="http://www.w3.org/2000/svg">
  <text class="dg-secondary" x="190" y="44" text-anchor="middle">a small offer</text>
  <text class="dg-secondary" x="350" y="44" text-anchor="middle">a large offer</text>

  <text class="dg-eyebrow" x="16" y="72">THE OFFER</text>
  <line class="dg-rule" x1="160" y1="68" x2="384" y2="68" />
  <line class="dg-ink" x1="190" y1="60" x2="190" y2="76" />
  <line class="dg-ink" x1="350" y1="60" x2="350" y2="76" />

  <line class="dg-accent" x1="190" y1="80" x2="350" y2="144" />
  <line class="dg-accent" x1="350" y1="80" x2="190" y2="144" />

  <text class="dg-eyebrow" x="16" y="156">YOUR AMPLITUDE</text>
  <line class="dg-rule" x1="160" y1="152" x2="384" y2="152" />
  <line class="dg-ink" x1="190" y1="144" x2="190" y2="160" />
  <line class="dg-ink" x1="350" y1="144" x2="350" y2="160" />

  <text class="dg-secondary" x="190" y="180" text-anchor="middle">reluctant</text>
  <text class="dg-secondary" x="350" y="180" text-anchor="middle">overaccepting</text>

  <text class="dg-note" x="16" y="206">the bigger the offer, the smaller the response that lands</text>
</svg>
