  <text class="dg-note" x="16" y="118">received</text>

  <line class="dg-ink" x1="150" y1="62" x2="150" y2="76" />
  <line class="dg-muted" x1="150" y1="69" x2="290" y2="69" />
  <text class="dg-note" x="150" y="94">an undefined shape</text>

  <rect class="dg-accent-fill" x="289" y="108" width="2" height="14" />
