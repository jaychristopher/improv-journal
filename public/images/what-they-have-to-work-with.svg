<svg viewBox="0 0 400 236" xmlns="http://www.w3.org/2000/svg">
  <text class="dg-eyebrow" x="16" y="30">WHAT THEY HAVE TO WORK WITH</text>

  <text class="dg-note" x="250" y="46" text-anchor="middle">what they started with</text>
  <line class="dg-rule" x1="250" y1="52" x2="250" y2="200" />

  <text class="dg-note" x="16" y="84">no you haven't</text>
  <line class="dg-muted" x1="190" y1="80" x2="222" y2="80" />

  <text class="dg-note" x="16" y="120">why were you waiting?</text>
  <line class="dg-muted" x1="190" y1="116" x2="250" y2="116" />

  <text class="dg-note" x="16" y="156">twenty minutes, wow</text>
  <line class="dg-muted" x1="190" y1="152" x2="250" y2="152" />

  <text class="dg-note-accent" x="16" y="192">I watched you park twice</text>
  <rect class="dg-accent-fill" x="190" y="187" width="150" height="2" />

  <text class="dg-note" x="16" y="228">only the last one leaves them more than they had</text>
</svg>
