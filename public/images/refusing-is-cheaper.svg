<svg viewBox="0 0 400 192" xmlns="http://www.w3.org/2000/svg">
  <text class="dg-eyebrow" x="16" y="52">REFUSING</text>
  <line class="dg-muted" x1="120" y1="48" x2="160" y2="48" />
  <text class="dg-note" x="172" y="52">no processing at all</text>

  <text class="dg-eyebrow" x="16" y="104">ACCEPTING</text>
  <line class="dg-ink" x1="120" y1="100" x2="360" y2="100" />
  <line class="dg-ink" x1="360" y1="94" x2="360" y2="106" />
  <text class="dg-secondary" x="120" y="128">take in what was established,</text>
  <text class="dg-secondary" x="120" y="146">then find what follows from it</text>

  <line class="dg-accent" x1="160" y1="32" x2="160" y2="112" />
  <text class="dg-note-accent" x="16" y="180">a reply that arrives this fast is worth suspecting</text>
</svg>
