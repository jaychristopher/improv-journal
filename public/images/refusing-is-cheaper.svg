<svg viewBox="0 0 400 204" xmlns="http://www.w3.org/2000/svg">
  <text class="dg-eyebrow" x="16" y="28">REFUSING</text>
  <line class="dg-muted" x1="16" y1="48" x2="72" y2="48" />
  <text class="dg-note" x="82" y="52">no processing at all</text>

  <text class="dg-eyebrow" x="16" y="96">ACCEPTING</text>
  <line class="dg-ink" x1="16" y1="116" x2="264" y2="116" />
  <line class="dg-ink" x1="264" y1="110" x2="264" y2="122" />
  <text class="dg-secondary" x="16" y="148">take in what was established,</text>
  <text class="dg-secondary" x="16" y="166">then find what follows from it</text>

  <line class="dg-accent" x1="72" y1="36" x2="72" y2="128" />
  <text class="dg-note-accent" x="16" y="190">a reply that arrives this fast is worth suspecting</text>
</svg>
