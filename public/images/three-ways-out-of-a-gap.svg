<svg viewBox="0 0 400 222" xmlns="http://www.w3.org/2000/svg">
  <text class="dg-eyebrow" x="120" y="32">THE GAP</text>
  <line class="dg-ink" x1="120" y1="42" x2="120" y2="164" />

  <line class="dg-ink" x1="120" y1="60" x2="162" y2="60" />
  <text class="dg-secondary" x="170" y="64">freeze</text>
  <text class="dg-note" x="170" y="82">the gap stays open</text>

  <line class="dg-ink" x1="120" y1="112" x2="162" y2="112" />
  <text class="dg-secondary" x="170" y="116">pretend it did not happen</text>
  <text class="dg-note" x="170" y="134">and they saw it anyway</text>

  <line class="dg-ink" x1="120" y1="164" x2="162" y2="164" />
  <text class="dg-secondary" x="170" y="168">name it</text>
  <text class="dg-note-accent" x="170" y="186">the gap becomes the scene</text>

  <text class="dg-note" x="16" y="212">all three are visible from the seats</text>
</svg>
