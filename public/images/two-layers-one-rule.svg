<svg viewBox="0 0 400 226" xmlns="http://www.w3.org/2000/svg">
  <text class="dg-eyebrow" x="16" y="30">TWO LAYERS, ONE RULE</text>

  <text class="dg-note" x="16" y="70">the fiction</text>
  <line class="dg-ink" x1="200" y1="58" x2="200" y2="72" />
  <line class="dg-ink" x1="320" y1="58" x2="320" y2="72" />
  <text class="dg-note" x="260" y="92" text-anchor="middle">argue, refuse, lie, fight</text>

  <text class="dg-note" x="16" y="156">the people making it</text>
  <line class="dg-ink" x1="200" y1="144" x2="200" y2="158" />
  <line class="dg-ink" x1="320" y1="144" x2="320" y2="158" />
  <rect class="dg-accent-fill" x="202" y="150" width="116" height="2" />
  <text class="dg-note-accent" x="260" y="178" text-anchor="middle">this is the one that cannot be refused</text>

  <text class="dg-note" x="16" y="212">the characters are not bound by it; the performers are</text>
</svg>
