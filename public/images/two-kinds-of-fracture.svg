<svg viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
  <text class="dg-eyebrow" x="16" y="30">TWO KINDS OF FRACTURE</text>

  <text class="dg-note" x="16" y="70">factual</text>
  <line class="dg-rule" x1="150" y1="66" x2="370" y2="66" />
  <line class="dg-ink" x1="190" y1="60" x2="190" y2="72" />
  <line class="dg-ink" x1="310" y1="60" x2="310" y2="72" />
  <rect class="dg-accent-fill" x="190" y="81" width="120" height="2" />
  <text class="dg-note" x="190" y="100">you can point at it</text>

  <text class="dg-note" x="16" y="152">tonal</text>
  <text class="dg-note" x="150" y="140">the facts</text>
  <line class="dg-rule" x1="150" y1="152" x2="370" y2="152" />
  <line class="dg-ink" x1="250" y1="146" x2="250" y2="158" />
  <text class="dg-note" x="264" y="140">nothing here differs</text>

  <text class="dg-note" x="150" y="184">the register</text>
  <line class="dg-rule" x1="150" y1="196" x2="370" y2="196" />
  <line class="dg-ink" x1="190" y1="190" x2="190" y2="202" />
  <line class="dg-ink" x1="310" y1="190" x2="310" y2="202" />
  <rect class="dg-accent-fill" x="190" y="211" width="120" height="2" />

  <text class="dg-note" x="16" y="232">only one of them shows up where people look</text>
</svg>
