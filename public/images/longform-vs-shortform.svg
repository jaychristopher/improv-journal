<svg viewBox="0 0 400 232" xmlns="http://www.w3.org/2000/svg">
  <text class="dg-eyebrow" x="16" y="32">SHORT FORM</text>
  <text class="dg-note" x="384" y="32" text-anchor="end">hardest at each start</text>

  <line class="dg-rule" x1="16" y1="64" x2="102" y2="64" />
  <line class="dg-rule" x1="110" y1="64" x2="196" y2="64" />
  <line class="dg-rule" x1="204" y1="64" x2="290" y2="64" />
  <line class="dg-rule" x1="298" y1="64" x2="384" y2="64" />

  <line class="dg-ink" x1="16" y1="64" x2="38" y2="64" />
  <line class="dg-ink" x1="110" y1="64" x2="132" y2="64" />
  <line class="dg-ink" x1="204" y1="64" x2="226" y2="64" />
  <line class="dg-ink" x1="298" y1="64" x2="320" y2="64" />

  <text class="dg-note" x="16" y="90">discrete games — nothing carries over</text>

  <text class="dg-eyebrow" x="16" y="150">LONG FORM</text>
  <text class="dg-note" x="384" y="150" text-anchor="end">hardest in the middle</text>

  <line class="dg-rule" x1="16" y1="182" x2="384" y2="182" />
