<svg viewBox="0 0 400 230" xmlns="http://www.w3.org/2000/svg">
  <text class="dg-eyebrow" x="16" y="30">WHEN THE BREAK LANDS</text>

  <text class="dg-note" x="185" y="62" text-anchor="middle">they laugh in anticipation</text>
  <line class="dg-ink" x1="185" y1="70" x2="185" y2="104" />
  <line class="dg-accent" x1="230" y1="88" x2="275" y2="88" />

  <line class="dg-rule" x1="120" y1="110" x2="370" y2="110" />
  <line class="dg-ink" x1="140" y1="104" x2="140" y2="116" />
  <line class="dg-ink" x1="185" y1="104" x2="185" y2="116" />
  <line class="dg-ink" x1="230" y1="104" x2="230" y2="116" />
  <line class="dg-ink" x1="275" y1="104" x2="275" y2="116" />
  <line class="dg-ink" x1="320" y1="104" x2="320" y2="116" />
  <line class="dg-ink" x1="365" y1="104" x2="365" y2="116" />

  <text class="dg-note" x="140" y="134" text-anchor="middle">1</text>
  <text class="dg-note" x="185" y="134" text-anchor="middle">2</text>
  <text class="dg-note" x="230" y="134" text-anchor="middle">3</text>
  <text class="dg-note" x="275" y="134" text-anchor="middle">4</text>
  <text class="dg-note" x="320" y="134" text-anchor="middle">5</text>
  <text class="dg-note" x="365" y="134" text-anchor="middle">6</text>

  <line class="dg-muted" x1="120" y1="158" x2="183" y2="158" />
  <text class="dg-note" x="120" y="176">nothing expected yet</text>
  <line class="dg-muted" x1="277" y1="158" x2="370" y2="158" />
  <text class="dg-note" x="370" y="176" text-anchor="end">it is the scene now</text>

  <text class="dg-note" x="16" y="214">the laugh at two is the cue, not the slot</text>
</svg>
