<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <text class="dg-eyebrow" x="16" y="30">TWO VERSIONS OF ONE FORM</text>

  <text class="dg-note" x="16" y="76">as first published</text>
  <line class="dg-ink" x1="180" y1="70" x2="180" y2="82" />

  <text class="dg-note" x="16" y="126">as anybody plays it</text>
  <line class="dg-ink" x1="320" y1="120" x2="320" y2="132" />

  <rect class="dg-accent-fill" x="180" y="99" width="140" height="2" />
  <rect class="dg-accent-fill" x="179" y="82" width="2" height="18" />
  <rect class="dg-accent-fill" x="319" y="100" width="2" height="20" />
  <text class="dg-note-accent" x="180" y="164">the gap this book documents</text>

  <text class="dg-note" x="16" y="192">both are called the Harold</text>
</svg>
